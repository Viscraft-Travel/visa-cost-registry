name: FX daily fetch

on:
  schedule:
    # 06:00 IST = 00:30 UTC
    - cron: "30 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  fetch-fx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch FX rates (writes data/fx.yaml, or opens an issue and exits non-zero on a >5% move)
        run: npm run fetch-fx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit data/fx.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fx.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update data/fx.yaml [automated]"
            git push
          fi
