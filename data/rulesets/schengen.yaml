id: schengen
corridor: schengen
description: >
  Rules and fees common to all Schengen member states for an Indian
  passport holder applying from India. Anything that varies by state
  (VAC operator, service charges, centre cities, processing time, and the
  official INR amount actually collected) lives on the destination file,
  not here.

