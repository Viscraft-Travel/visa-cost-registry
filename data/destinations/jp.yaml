# Reference file — standalone destination (no ruleset). Contrasts with
# fr.yaml: Japan's application mechanics for Indian applicants are less
# uniformly documented than the Schengen VAC model, so nothing here is
# asserted structurally — everything is null pending first verification.
# The source_url below is the well-known www.<cc>.emb-japan.go.jp pattern
# used across all Japanese embassy sites, but the fetch returned 403 and
# was not confirmed live; the first verifier must open it directly.

identity:
  iso_code: jp
  name: Japan
  corridor: japan
  ruleset: null
  tier: light
  owner: TBD

